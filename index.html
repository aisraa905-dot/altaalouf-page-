<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>جمعية التآلف</title>
  <style>
    body {
      font-family: Tahoma, Arial;
      text-align: center;
      padding-top: 40px;
      background: linear-gradient(135deg, #f5f7fa, #e4ecf5);
    }
    h2 {
      margin-bottom: 40px;
      color: #333;
      font-size: 28px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin: 20px auto;
      padding: 22px 25px;
      width: 90%;
      max-width: 450px;
      background: #1e88e5;
      color: white;
      text-decoration: none;
      border-radius: 18px;
      font-size: 24px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.2);
      transition: 0.2s;
    }
    .btn:hover {
      transform: scale(1.03);
    }
    .btn span.icon {
      font-size: 32px;
      margin-right: 15px;
    }
    .site { background: #1976d2; }
    .map { background: #2e7d32; }
    .call { background: #c62828; }
    .whatsapp { background: #25d366; }
  </style>
</head>
<body>

  <h2>روابط جمعية التآلف</h2>

  <a class="btn site" href="http://altaalouf.org/new.html">
    <span class="icon">🌐</span> الموقع الالكتروني لجمعية التآلف
  </a>

  <a class="btn map" href="https://maps.app.goo.gl/UBNYrpL2M9XPYntL6">
    <span class="icon">📍</span> عنوان مول التآلف للتسوق
  </a>

  <a class="btn call" href="tel:0930033034">
    <span class="icon">📞</span> للاستفسار والشكاوي
  </a>

  <a class="btn whatsapp" href="tel:0930099064">
    <span class="icon">💬</span> تواصل معنا
  </a>

</body>
</html>
